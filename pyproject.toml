[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cuwm"
version = "0.1.0"
description = "World Model Evaluation for Office Applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "diffusers>=0.30",
    "Pillow>=10.0",
    "tqdm>=4.60",
    "openai>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-image>=0.21",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "safetensors>=0.4",
    "accelerate>=0.20",
    "pyyaml>=6.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
azure = [
    "azure-identity>=1.15",
    "msal>=1.25",
]

[tool.setuptools.packages.find]
include = ["eval*", "utils*", "prompts*", "config*", "scripts*", "textual*", "infer*"]
